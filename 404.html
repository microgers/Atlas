<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Atlas — page not found</title>
<meta name="color-scheme" content="light dark">
<link rel="icon" href="favicon-32.png" sizes="32x32">
<link rel="stylesheet" href="shared.css">
<style>
.lost{min-height:70vh;display:flex;flex-direction:column;justify-content:center;align-items:flex-start}
.code{font-size:88px;font-weight:700;letter-spacing:-.04em;line-height:1;color:var(--label2);
  font-variant-numeric:tabular-nums;margin-bottom:6px}
.go{display:inline-flex;align-items:center;gap:8px;background:var(--blue);color:#fff;
  padding:13px 22px;border-radius:12px;font-size:17px;font-weight:600;margin-top:22px}
.go:hover{text-decoration:none;opacity:.9}
</style>
</head>
<body>
<div class="wrap">
  <div class="lost">
    <div class="code">404</div>
    <h1>Nothing at these coordinates.</h1>
    <p class="lede">The page you asked for is not on this site. The map, however, is right where you left it.</p>
    <a class="go" href="./">Open Atlas</a>
  </div>
</div>
</body>
</html>
