<style>
:root{
  --blue:#007AFF; --green:#34C759; --red:#FF3B30; --orange:#FF9500;
  --indigo:#5856D6; --teal:#30B0C7; --pink:#FF2D55; --ask:#FFC300;
  --bg:#F2F2F7; --bg2:#FFFFFF; --bg3:#FFFFFF; --fill:rgba(120,120,128,.12);
  --label:#000; --label2:rgba(60,60,67,.6); --label3:rgba(60,60,67,.3);
  --sep:rgba(60,60,67,.18); --navbg:rgba(249,249,251,.8);
  --sea:#AFCBE3; --seaHi:#CFE2F1; --land:#E9E9EB; --landOff:#DCDCE0;
  --line:#9A9AA0; --lineOff:#C2C2C8; --grat:rgba(0,0,0,.07); --limb:rgba(0,0,0,.18);
  --dot:#8E8E93; --dotRing:#fff; --labelBg:rgba(255,255,255,.92); --labelFg:#000;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Segoe UI",system-ui,sans-serif;
  --r:14px; --spring:cubic-bezier(.32,.72,0,1);
}

  --bg:#000; --bg2:#1C1C1E; --bg3:#2C2C2E; --fill:rgba(120,120,128,.24);

  --sep:rgba(84,84,88,.65); --navbg:rgba(20,20,22,.8);
  --blue:#0A84FF; --green:#30D158; --red:#FF453A; --orange:#FF9F0A;
  --indigo:#5E5CE6; --teal:#40C8E0; --pink:#FF375F; --ask:#FFD60A;
  --sea:#0C2438; --seaHi:#17415F; --land:#3A3A3C; --landOff:#242426;
  --line:#8E8E93; --lineOff:#48484A; --grat:rgba(255,255,255,.07); --limb:rgba(255,255,255,.22);
  --dot:#8E8E93; --dotRing:#0C2438; --labelBg:rgba(28,28,30,.92); --labelFg:#fff;
}}
:root[data-theme="dark"]{
  --bg:#000; --bg2:#1C1C1E; --bg3:#2C2C2E; --fill:rgba(120,120,128,.24);
  --label:#fff; --label2:rgba(235,235,245,.6); --label3:rgba(235,235,245,.3);
  --sep:rgba(84,84,88,.65); --navbg:rgba(20,20,22,.8);
  --blue:#0A84FF; --green:#30D158; --red:#FF453A; --orange:#FF9F0A;
  --indigo:#5E5CE6; --teal:#40C8E0; --pink:#FF375F; --ask:#FFD60A;
  --sea:#0C2438; --seaHi:#17415F; --land:#3A3A3C; --landOff:#242426;
  --line:#8E8E93; --lineOff:#48484A; --grat:rgba(255,255,255,.07); --limb:rgba(255,255,255,.22);
  --dot:#8E8E93; --dotRing:#0C2438; --labelBg:rgba(28,28,30,.92); --labelFg:#fff;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--label);font-family:var(--font);
  font-size:17px;line-height:1.35;overscroll-behavior-y:none;
  -webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px;border-radius:6px}

/* ---------- shell ---------- */
.app{min-height:100dvh;display:flex;flex-direction:column}
.nav{position:sticky;top:0;z-index:30;background:var(--navbg);
  -webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);
  border-bottom:.5px solid var(--sep);
  padding:max(6px,env(safe-area-inset-top)) 8px 6px;
  display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:6px;min-height:44px}
.nav .t{font-size:17px;font-weight:600;letter-spacing:-.01em;text-align:center;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nb{color:var(--blue);font-size:17px;display:inline-flex;align-items:center;gap:2px;
  padding:6px 8px;border-radius:8px;justify-self:start;min-height:36px}
.nb.r{justify-self:end}
.nb:active{opacity:.4}
.nb svg{width:12px;height:20px}

.stage{position:relative;background:var(--sea);flex:0 0 auto}
.stage canvas{display:block;width:100%;height:100%;touch-action:none}
@media (min-width:900px){
  .app{display:grid;grid-template-columns:minmax(0,1fr) 440px;grid-template-rows:100dvh}
  .stage{grid-row:1;grid-column:1;height:100dvh}
  .side{grid-row:1;grid-column:2;height:100dvh;overflow-y:auto;border-left:.5px solid var(--sep);
    background:var(--bg);display:flex;flex-direction:column}
  .nav{grid-column:2}
}
@media (max-width:899px){ .side{display:flex;flex-direction:column;flex:1} }

.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding-bottom:calc(40px + env(safe-area-inset-bottom))}
.pad{padding:0 16px}

/* ---------- type ---------- */
.large{font-size:34px;line-height:1.06;font-weight:700;letter-spacing:-.022em;
  margin:8px 0 2px;text-wrap:balance}
.sub{color:var(--label2);font-size:15px;margin:0 0 4px}
.say{color:var(--label2);font-size:14px;font-style:italic}
.ghead{font-size:13px;font-weight:600;letter-spacing:.02em;text-transform:uppercase;
  color:var(--label2);padding:22px 16px 7px}
.foot{font-size:13px;color:var(--label2);padding:8px 16px 0;line-height:1.4}

/* ---------- grouped list ---------- */
.group{background:var(--bg2);border-radius:var(--r);overflow:hidden;margin:0 16px}
.row{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;
  width:100%;padding:11px 14px;text-align:left;position:relative;min-height:52px}
.row+.row::before{content:"";position:absolute;left:14px;right:0;top:0;height:.5px;background:var(--sep)}
.row:active{background:var(--fill)}
.row .ic{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;
  font-size:14px;font-weight:700;color:#fff;flex:0 0 auto}
.row .m{min-width:0}
.row .m b{display:block;font-size:17px;font-weight:400;letter-spacing:-.01em}
.row .m span{display:block;font-size:13px;color:var(--label2);margin-top:1px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .rt{display:flex;align-items:center;gap:6px;color:var(--label2);font-size:15px;
  font-variant-numeric:tabular-nums}
.chev{width:8px;height:13px;opacity:.35;flex:0 0 auto}
.ring{width:28px;height:28px;flex:0 0 auto}
.ring circle{fill:none;stroke-width:3.4}
.ring .bg{stroke:var(--fill)}
.ring .fg{stroke:var(--green);stroke-linecap:round;transition:stroke-dashoffset .5s var(--spring)}

/* ---------- buttons ---------- */
.btns{display:flex;flex-direction:column;gap:10px;padding:16px}
.bt{display:flex;align-items:center;justify-content:center;gap:8px;
  padding:14px 18px;border-radius:12px;font-size:17px;font-weight:600;letter-spacing:-.01em;
  background:var(--fill);color:var(--blue);transition:transform .12s var(--spring)}
.bt:active{transform:scale(.975)}
.bt.p{background:var(--blue);color:#fff}
.bt.g{background:var(--green);color:#fff}
.bt[disabled]{opacity:.35;pointer-events:none}
.bt.sm{padding:9px 14px;font-size:15px;border-radius:10px}
.brow{display:flex;gap:10px;padding:0 16px 16px;flex-wrap:wrap}
.brow .bt{flex:1;min-width:130px}

/* ---------- teaching card ---------- */
.card{background:var(--bg2);border-radius:var(--r);margin:0 16px;padding:16px;
  animation:pop .34s var(--spring)}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.99)}to{opacity:1;transform:none}}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;
  letter-spacing:.06em;text-transform:uppercase;color:var(--blue);padding:0 16px 6px}
.cname{font-size:30px;font-weight:700;letter-spacing:-.024em;line-height:1.06;
  display:flex;align-items:center;gap:9px;flex-wrap:wrap;text-wrap:balance}
.kv{display:flex;gap:10px;align-items:baseline;margin-top:12px;font-size:15px}
.kv .k{color:var(--label2);font-size:13px;text-transform:uppercase;letter-spacing:.04em;
  flex:0 0 58px;padding-top:2px}
.kv .v{font-weight:600}
.hook{margin-top:14px;padding-top:12px;border-top:.5px solid var(--sep);
  font-size:15px;color:var(--label2);line-height:1.45}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.chip{font-size:13px;background:var(--fill);border-radius:99px;padding:5px 11px;font-weight:500}
.spk{width:30px;height:30px;border-radius:50%;background:var(--fill);color:var(--blue);
  display:inline-grid;place-items:center;flex:0 0 auto}
.spk:active{background:var(--blue);color:#fff}
.spk svg{width:15px;height:15px}

/* ---------- quiz ---------- */
.ask{font-size:26px;font-weight:700;letter-spacing:-.02em;line-height:1.1;
  padding:2px 16px 0;display:flex;gap:9px;align-items:center;flex-wrap:wrap;text-wrap:balance}
.asksub{padding:6px 16px 0;color:var(--label2);font-size:14px;font-style:italic}
.opts{display:grid;gap:9px;padding:16px}
.opt{padding:15px 16px;border-radius:12px;background:var(--bg2);font-size:17px;
  text-align:left;font-weight:500;transition:transform .12s var(--spring)}
.opt:active{transform:scale(.985)}
.opt.ok{background:var(--green);color:#fff}
.opt.no{background:var(--red);color:#fff}
.fb{padding:2px 16px;min-height:3em;font-size:15px}
.fb b{font-weight:700}
.fb .ok{color:var(--green)} .fb .no{color:var(--red)}
.fb i{display:block;font-style:normal;color:var(--label2);margin-top:4px;line-height:1.4}
.prog{height:3px;background:var(--fill);position:relative;overflow:hidden}
.prog i{position:absolute;inset:0 auto 0 0;background:var(--blue);width:0;
  transition:width .35s var(--spring)}
.stats{display:flex;gap:26px;padding:14px 16px 0}
.stats i{display:block;font-style:normal;font-size:26px;font-weight:700;
  letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.stats em{display:block;font-style:normal;font-size:12px;color:var(--label2);
  text-transform:uppercase;letter-spacing:.05em;margin-top:1px}
.big{font-size:64px;font-weight:700;letter-spacing:-.04em;line-height:1;
  font-variant-numeric:tabular-nums;padding:6px 16px 0}
.big span{font-size:.32em;color:var(--label2);letter-spacing:0;margin-left:4px}

/* ---------- projection picker ---------- */
.seg{display:flex;background:var(--fill);border-radius:10px;padding:2px;margin:0 16px;gap:2px}
.seg button{flex:1;padding:7px 4px;border-radius:8px;font-size:13px;font-weight:600;
  color:var(--label);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--bg2);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.pnote{padding:10px 16px 0;font-size:13px;color:var(--label2);line-height:1.45}

.weak{display:flex;flex-wrap:wrap;gap:6px;padding:0 16px}
.weak span{font-size:13px;border-radius:99px;padding:4px 10px;background:var(--fill);
  font-variant-numeric:tabular-nums}
.empty{color:var(--label2);font-size:15px;padding:0 16px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:899px){ .stage{height:min(44dvh,420px);min-height:220px} }
#nav-right{justify-self:end;display:flex;align-items:center;gap:4px}

/* ---------- projection reference ---------- */
.pdef{background:var(--bg2);border-radius:var(--r);margin:0 16px 10px;padding:14px 16px 15px;
  border:1.5px solid transparent}
.pdef.live{border-color:var(--blue)}
.ptitle{display:flex;flex-direction:column;gap:1px;width:100%;text-align:left;padding:0 0 8px}
.pn{font-size:20px;font-weight:700;letter-spacing:-.018em;display:flex;align-items:baseline;gap:8px}
.pn em{font-style:normal;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
  color:var(--blue)}
.ps{font-size:13px;color:var(--label2)}
.pd{font-size:14px;color:var(--label2);line-height:1.45;margin:0 0 11px}
.pkv{display:grid;grid-template-columns:84px 1fr;gap:10px;font-size:14px;line-height:1.4;
  color:var(--label2);padding-top:8px;border-top:.5px solid var(--sep)}
.pk{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding-top:3px}
.pk.keep{color:var(--green)}
.pk.cost{color:var(--orange)}

</style>

<script>
/* ===================== projections =====================
   Each takes lon/lat in DEGREES and returns [x, y] in a
   unit-ish space, plus a `visible` flag for the globe.      */
const D2R = Math.PI / 180;

const PROJECTIONS = {
  globe: {
    name: 'Globe', sub: 'Orthographic',
    note: 'What the Earth actually looks like from space. Drag to spin it.',
    defn: 'The sphere drawn as you would see it from very far away — one hemisphere at a time, the way a satellite or the Moon sees it.',
    keeps: 'Truth. Near the centre of the disc, shape, area, direction and distance are all correct at once, because nothing has been flattened.',
    costs: 'Reach. You only ever see half the world, and everything near the rim is squashed edge-on into almost nothing.',
    rotates: true, ratio: 1,
    fwd(lon, lat, R) {
      const l = (lon - R.lon) * D2R, p = lat * D2R, p0 = R.lat * D2R;
      const cp = Math.cos(p), sp = Math.sin(p), cl = Math.cos(l);
      const cosc = Math.sin(p0) * sp + Math.cos(p0) * cp * cl;
      let x = cp * Math.sin(l);
      let y = Math.cos(p0) * sp - Math.sin(p0) * cp * cl;
      if (cosc < 0) { const m = Math.hypot(x, y) || 1; x /= m; y /= m; }
      return [x, -y, cosc >= 0];
    },
    bounds: [-1, -1, 1, 1]
  },

  equirect: {
    name: 'Flat', sub: 'Equirectangular',
    note: 'Longitude and latitude as a plain grid.',
    defn: 'Longitude becomes x, latitude becomes y, and that is the entire projection — every degree gets the same width and the same height.',
    keeps: 'Simplicity. Coordinates land on the page with no maths at all, which is why nearly all satellite imagery and elevation data ships in this format.',
    costs: 'Shape and area everywhere off the equator. Each pole is stretched into a line as long as the equator itself, so the top and bottom of the map smear sideways.',
    ratio: 2,
    fwd(lon, lat) { return [lon / 180, -lat / 90 * 0.5, true]; },
    bounds: [-1, -0.5, 1, 0.5]
  },

  mercator: {
    name: 'Mercator', sub: 'Conformal cylindrical',
    note: "The sailor's map, and the one the web inherited.",
    defn: 'A cylindrical projection that stretches north-south spacing by exactly as much as east-west spacing has already been stretched at each latitude.',
    keeps: 'Angles. Any straight line is a constant compass bearing, which made it indispensable for navigation from 1569 onward and is why web maps still use it.',
    costs: 'Area, catastrophically, toward the poles. Greenland appears about the size of Africa. Africa is fourteen times larger.',
    ratio: 1,
    fwd(lon, lat) {
      const p = Math.max(-85, Math.min(85, lat)) * D2R;
      return [lon / 180, -Math.log(Math.tan(Math.PI / 4 + p / 2)) / Math.PI, true];
    },
    bounds: [-1, -1, 1, 1]
  },

  robinson: {
    name: 'Robinson', sub: 'Compromise pseudocylindrical',
    note: 'The classroom wall map.',
    defn: 'A compromise built by eye rather than derived from a formula: Arthur Robinson adjusted a table of numbers in 1963 until the finished map simply looked right.',
    keeps: 'Overall appearance. Nothing is badly distorted anywhere, so continents keep recognisable shapes and roughly believable relative sizes.',
    costs: 'Exactness. It preserves no property at all — not area, not angle, not distance. It is wrong everywhere by a little, which makes it useless for measuring.',
    ratio: 1.97,
    fwd(lon, lat) {
      const T = PROJECTIONS.robinson._T;
      const a = Math.abs(lat) / 5, i = Math.min(17, Math.floor(a)), f = a - i;
      const A = T[i], B = T[Math.min(18, i + 1)];
      const X = A[0] + (B[0] - A[0]) * f, Y = A[1] + (B[1] - A[1]) * f;
      return [X * lon / 180, -(lat < 0 ? -Y : Y) * 0.5, true];
    },
    bounds: [-1, -0.5072, 1, 0.5072],
    _T: [[1,0],[0.9986,0.062],[0.9954,0.124],[0.99,0.186],[0.9822,0.248],[0.973,0.31],
         [0.96,0.372],[0.9427,0.434],[0.9216,0.4958],[0.8962,0.5571],[0.8679,0.6176],
         [0.835,0.6769],[0.7986,0.7346],[0.7597,0.7903],[0.7186,0.8435],[0.6732,0.8936],
         [0.6213,0.9394],[0.5722,0.9761],[0.5322,1]]
  },

  winkel: {
    name: 'Winkel Tripel', sub: 'Modified azimuthal',
    note: "National Geographic's world map since 1998.",
    defn: 'The arithmetic average of an equirectangular grid and an Aitoff projection. Tripel is German for triple — the three distortions it balances at once.',
    keeps: 'Balance. It carries the lowest combined distortion of area, direction and distance of any common world map, which is why National Geographic switched to it.',
    costs: 'Any single property being exactly right, and the outer meridians curve hard enough that the far left and right of the map visibly stretch.',
    ratio: 1.64,
    fwd(lon, lat) {
      const l = lon * D2R, p = lat * D2R;
      const c1 = Math.acos(2 / Math.PI);
      const a = Math.acos(Math.cos(p) * Math.cos(l / 2));
      const s = a === 0 ? 1 : Math.sin(a) / a;
      const x = 0.5 * (l * Math.cos(c1) + 2 * Math.cos(p) * Math.sin(l / 2) / s);
      const y = 0.5 * (p + Math.sin(p) / s);
      return [x / Math.PI, -y / (Math.PI / 2) * 0.5, true];
    },
    bounds: [-1, -0.5, 1, 0.5]
  }
};
const PROJ_ORDER = ['globe', 'equirect', 'mercator', 'robinson', 'winkel'];

/* ===================== canvas world map =====================
   Satellite-style renderer. The globe is shaded as a sphere in
   space: biome-coloured land, a continental-shelf glow around the
   coasts, an atmospheric limb, and a lit hemisphere. Drawing is
   coalesced into requestAnimationFrame so dragging stays smooth. */

const Q = 0.02;   /* degrees per stored unit */

function decodeShape(s) {
  const rings = [];
  for (const part of s.split('|')) {
    const i = part.indexOf(';');
    const head = i < 0 ? part : part.slice(0, i);
    const tail = i < 0 ? '' : part.slice(i + 1);
    const c = head.split(',');
    let x = +c[0], y = +c[1];
    const pts = [x * Q, y * Q];
    if (tail) for (const pr of tail.split(' ')) {
      const k = pr.indexOf(',');
      x += +pr.slice(0, k); y += +pr.slice(k + 1);
      pts.push(x * Q, y * Q);
    }
    rings.push(pts);
  }
  return rings;
}

/* ---------- biome ramp: |latitude| -> plausible ground colour ---------- */
const BIOME = [
  [0,  [ 44,  96,  54]],   /* rainforest      */
  [10, [ 58, 104,  54]],   /* wet tropics     */
  [18, [126, 136,  74]],   /* savanna         */
  [25, [182, 158, 106]],   /* desert belt     */
  [33, [156, 146,  96]],   /* dry steppe      */
  [42, [ 86, 116,  66]],   /* temperate       */
  [55, [ 60,  90,  64]],   /* boreal          */
  [64, [110, 128, 112]],   /* tundra          */
  [72, [220, 229, 237]],   /* ice             */
  [90, [240, 246, 252]]
];

function fnv(s) {
  let h = 2166136261;
  for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
  return ((h >>> 0) % 1000) / 1000;
}

function biomeRGB(lat, jitter) {
  const a = Math.min(90, Math.abs(lat));
  let i = 0;
  while (i < BIOME.length - 2 && BIOME[i + 1][0] < a) i++;
  const A = BIOME[i], B = BIOME[i + 1];
  const t = Math.max(0, Math.min(1, (a - A[0]) / (B[0] - A[0])));
  const k = 0.9 + jitter * 0.2;
  return [0, 1, 2].map(n =>
    Math.round(Math.max(8, Math.min(252, (A[1][n] + (B[1][n] - A[1][n]) * t) * k))));
}

function WorldMap(canvas, data) {
  const ctx = canvas.getContext('2d');

  const SH = {};
  for (const c in data.c) SH[c] = decodeShape(data.c[c].d);
  const CTXSH = {};
  for (const n in data.x) CTXSH[n] = decodeShape(data.x[n]);

  /* centroid + span of every shape, in degrees */
  function measure(rings) {
    let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9, bi = 0, ba = -1;
    rings.forEach((r, i) => {
      let mx0 = 1e9, my0 = 1e9, mx1 = -1e9, my1 = -1e9;
      for (let k = 0; k < r.length; k += 2) {
        const X = r[k], Y = r[k + 1];
        if (X < mx0) mx0 = X; if (X > mx1) mx1 = X;
        if (Y < my0) my0 = Y; if (Y > my1) my1 = Y;
      }
      const a = (mx1 - mx0) * (my1 - my0);
      if (a > ba) { ba = a; bi = i; }
      if (mx0 < x0) x0 = mx0; if (mx1 > x1) x1 = mx1;
      if (my0 < y0) y0 = my0; if (my1 > y1) y1 = my1;
    });
    const big = rings[bi];
    let cx = 0, cy = 0;
    for (let k = 0; k < big.length; k += 2) { cx += big[k]; cy += big[k + 1]; }
    cx /= big.length / 2; cy /= big.length / 2;

    /* How far the country really reaches, measured as wrapped offsets from
       its own centre and counting only the rings that belong to the same
       landmass. That keeps Russia and Sweden whole while leaving French
       Guiana, Reunion, Hawaii and Svalbard out of the framing maths. */
    const NEAR = 25;
    let w = 0, e = 0, s = 0, n = 0;
    rings.forEach(r => {
      let rx = 0, ry = 0;
      for (let k = 0; k < r.length; k += 2) { rx += r[k]; ry += r[k + 1]; }
      rx /= r.length / 2; ry /= r.length / 2;
      const dl0 = ((rx - cx + 540) % 360) - 180;
      if (Math.hypot(dl0 * Math.cos(cy * Math.PI / 180), ry - cy) > NEAR) return;
      for (let k = 0; k < r.length; k += 2) {
        const dl = ((r[k] - cx + 540) % 360) - 180, da = r[k + 1] - cy;
        if (dl < -w) w = -dl; if (dl > e) e = dl;
        if (da < -s) s = -da; if (da > n) n = da;
      }
    });

    return { lon: cx, lat: cy, bbox: [x0, y0, x1, y1], ext: { w: w, e: e, s: s, n: n },
             span: Math.max(x1 - x0, y1 - y0) };
  }

  const META = {}, CTXMETA = {}, LANDC = {}, LANDM = {}, CTXC = {}, CTXM = {};
  /* muted = blended toward slate, used while one country is spotlit */
  const mute = (rgb, amt) => 'rgb(' + rgb.map((v, i) =>
    Math.round(v + ([92, 106, 122][i] - v) * amt)).join(',') + ')';
  for (const c in SH) {
    META[c] = measure(SH[c]);
    const rgb = biomeRGB(META[c].lat, fnv(c));
    LANDC[c] = 'rgb(' + rgb.join(',') + ')';
    LANDM[c] = mute(rgb, 0.62);
  }
  for (const n in CTXSH) {
    CTXMETA[n] = measure(CTXSH[n]);
    const rgb = biomeRGB(CTXMETA[n].lat, fnv(n)).map(v => Math.round(v * 0.82));
    CTXC[n] = 'rgb(' + rgb.join(',') + ')';
    CTXM[n] = mute(rgb, 0.62);
  }

  const S = {
    proj: 'globe', rot: { lon: -20, lat: 18 }, zoom: 1,
    pan: { x: 0, y: 0 }, paint: {}, labels: [], dim: null, markers: null, only: null,
    showContext: true, onPick: null, theme: {}, focus: null
  };

  let W = 0, H = 0, DPR = 1, paths = {}, pbox = {}, anim = 0, flying = false;
  let fast = false, queued = 0, stars = null, starsKey = '';
  let pulseUntil = 0, pulseId = 0;

  function size() {
    const r = canvas.getBoundingClientRect();
    DPR = Math.min(2.5, window.devicePixelRatio || 1);
    W = Math.max(1, Math.round(r.width)); H = Math.max(1, Math.round(r.height));
    canvas.width = W * DPR; canvas.height = H * DPR;
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    stars = null;
  }

  function frame() {
    const P = PROJECTIONS[S.proj], b = P.bounds;
    const bw = b[2] - b[0], bh = b[3] - b[1];
    const k = Math.min(W / bw, H / bh) * 0.94 * S.zoom;
    return { P, k, ox: W / 2 - ((b[0] + b[2]) / 2) * k + S.pan.x,
                  oy: H / 2 - ((b[1] + b[3]) / 2) * k + S.pan.y };
  }

  /* Turn a tap back into lon/lat. Only the globe needs this: it is the one
     projection where far-side vertices get flattened onto the rim, which can
     leave a shape's outline sweeping across ground it does not occupy. */
  function unproject(px, py) {
    if (S.proj !== 'globe') return null;
    const f = frame(), k = f.k;
    const x = (px - f.ox) / k, y = -(py - f.oy) / k;
    const rho = Math.hypot(x, y);
    if (rho > 1 || rho === 0) return rho > 1 ? null : { lon: S.rot.lon, lat: S.rot.lat };
    const c = Math.asin(rho), sc = Math.sin(c), cc = Math.cos(c);
    const p0 = S.rot.lat * D2R, sp0 = Math.sin(p0), cp0 = Math.cos(p0);
    const lat = Math.asin(cc * sp0 + (y * sc * cp0) / rho) / D2R;
    let lon = S.rot.lon + Math.atan2(x * sc, rho * cc * cp0 - y * sc * sp0) / D2R;
    lon = ((lon + 540) % 360) - 180;
    return { lon: lon, lat: lat };
  }

  /* Does this tap actually fall within the country's own extent? */
  function inBox(c, ll) {
    if (!ll) return true;
    const bb = META[c].bbox, pad = 1.5;
    if (ll.lat < bb[1] - pad || ll.lat > bb[3] + pad) return false;
    if (bb[2] - bb[0] > 180) return true;          /* wraps the date line */
    return ll.lon >= bb[0] - pad && ll.lon <= bb[2] + pad;
  }

  /* Cheap back-face test: is any part of this shape on the lit side? */
  function onNearSide(m) {
    if (!PROJECTIONS[S.proj].rotates) return true;
    const dl = ((m.lon - S.rot.lon + 540) % 360) - 180;
    const cosc = Math.sin(S.rot.lat * D2R) * Math.sin(m.lat * D2R) +
                 Math.cos(S.rot.lat * D2R) * Math.cos(m.lat * D2R) * Math.cos(dl * D2R);
    /* allow a generous margin so shapes straddling the limb still draw */
    return cosc > -Math.min(0.95, (m.span + 8) / 90);
  }

  function buildPaths() {
    const f = frame(), { P, k, ox, oy } = f;
    const rotates = !!P.rotates;
    paths = {}; pbox = {};

    /* `bx` is the on-screen box of the biggest ring — the main landmass, not
       the outlying islands. Labels need the real pixels, not an estimate. */
    const make = (rings) => {
      const p = new Path2D();
      let any = false, bx = null, ba = -1, boxes = [];
      let fx0 = 1e9, fy0 = 1e9, fx1 = -1e9, fy1 = -1e9;
      for (const r of rings) {
        let rx0 = 1e9, ry0 = 1e9, rx1 = -1e9, ry1 = -1e9;
        if (rotates) {
          let visible = false;
          for (let i = 0; i < r.length; i += 2) {
            if (P.fwd(r[i], r[i + 1], S.rot)[2]) { visible = true; break; }
          }
          if (!visible) continue;
        }
        let started = false, drew = 0, prevLon = null;
        for (let i = 0; i < r.length; i += 2) {
          const lon = r[i];
          const cut = !rotates && prevLon !== null && Math.abs(lon - prevLon) > 180;
          prevLon = lon;
          const q = P.fwd(lon, r[i + 1], S.rot);
          const x = q[0] * k + ox, y = q[1] * k + oy;
          if (x < rx0) rx0 = x; if (x > rx1) rx1 = x;
          if (y < ry0) ry0 = y; if (y > ry1) ry1 = y;
          if (!started || cut) {
            if (started && drew > 2) p.closePath();
            p.moveTo(x, y); started = true; drew = 1;
          } else { p.lineTo(x, y); drew++; }
        }
        if (drew > 2) {
          p.closePath(); any = true;
          const a = (rx1 - rx0) * (ry1 - ry0);
          const rb = { x0: rx0, y0: ry0, x1: rx1, y1: ry1 };
          boxes.push(rb);
          if (a > ba) { ba = a; bx = rb; }
          if (rx0 < fx0) fx0 = rx0; if (rx1 > fx1) fx1 = rx1;
          if (ry0 < fy0) fy0 = ry0; if (ry1 > fy1) fy1 = ry1;
        }
      }
      if (bx) {
        bx = { x0: bx.x0, y0: bx.y0, x1: bx.x1, y1: bx.y1, rings: boxes,
               all: { x0: fx0, y0: fy0, x1: fx1, y1: fy1 } };
      }
      return any ? { p: p, bx: bx } : null;
    };

    for (const c in SH) {
      if (S.only && !S.only.has(c)) continue;
      if (!onNearSide(META[c])) continue;
      const p = make(SH[c]);
      if (p) { paths[c] = p.p; pbox[c] = p.bx; }
    }
    paths.__ctx = {};
    if (S.showContext && !S.only) {
      for (const n in CTXSH) {
        if (!onNearSide(CTXMETA[n])) continue;
        const p = make(CTXSH[n]);
        if (p) paths.__ctx[n] = p.p;
      }
    }
    return f;
  }

  /* ---------- star field, built once per canvas size ---------- */
  function starField() {
    const key = W + 'x' + H;
    if (stars && starsKey === key) return stars;
    const c = document.createElement('canvas');
    c.width = Math.max(1, W); c.height = Math.max(1, H);
    const g = c.getContext('2d');
    let seed = 20260911;
    const rnd = () => (seed = (seed * 1103515245 + 12345) & 0x7fffffff) / 0x7fffffff;
    const n = Math.round(W * H / 2400);
    for (let i = 0; i < n; i++) {
      const x = rnd() * W, y = rnd() * H, r = rnd() * 0.85 + 0.22;
      const a = rnd() * 0.5 + 0.1;
      g.beginPath(); g.arc(x, y, r, 0, 7);
      g.fillStyle = 'rgba(255,255,255,' + a.toFixed(2) + ')';
      g.fill();
    }
    /* a handful of brighter ones */
    for (let i = 0; i < Math.max(4, n / 60); i++) {
      const x = rnd() * W, y = rnd() * H;
      const gr = g.createRadialGradient(x, y, 0, x, y, 2.6);
      gr.addColorStop(0, 'rgba(255,255,255,.85)');
      gr.addColorStop(1, 'rgba(255,255,255,0)');
      g.fillStyle = gr;
      g.beginPath(); g.arc(x, y, 2.6, 0, 7); g.fill();
    }
    stars = c; starsKey = key;
    return c;
  }

  const SPACE_TOP = '#070B16', SPACE_BOT = '#03060D';

  function draw() {
    if (!W) size();
    const f = buildPaths(), { P, k, ox, oy } = f, T = S.theme;
    const globe = S.proj === 'globe';
    const detail = !fast;

    ctx.clearRect(0, 0, W, H);

    /* ---------- background ---------- */
    if (globe) {
      const sg = ctx.createLinearGradient(0, 0, 0, H);
      sg.addColorStop(0, SPACE_TOP); sg.addColorStop(1, SPACE_BOT);
      ctx.fillStyle = sg; ctx.fillRect(0, 0, W, H);
      if (detail) ctx.drawImage(starField(), 0, 0);

      /* atmosphere */
      const ag = ctx.createRadialGradient(ox, oy, k * 0.9, ox, oy, k * 1.18);
      ag.addColorStop(0.00, 'rgba(74,150,255,0)');
      ag.addColorStop(0.62, 'rgba(78,156,255,0.30)');
      ag.addColorStop(0.82, 'rgba(126,186,255,0.16)');
      ag.addColorStop(1.00, 'rgba(78,156,255,0)');
      ctx.fillStyle = ag;
      ctx.beginPath(); ctx.arc(ox, oy, k * 1.18, 0, 7); ctx.fill();
    } else {
      const og = ctx.createLinearGradient(0, 0, 0, H);
      og.addColorStop(0, '#0A2036'); og.addColorStop(0.5, '#12456E'); og.addColorStop(1, '#0A2036');
      ctx.fillStyle = og; ctx.fillRect(0, 0, W, H);
    }

    ctx.save();
    if (globe) {
      ctx.beginPath(); ctx.arc(ox, oy, k, 0, 7); ctx.closePath();
      const g = ctx.createRadialGradient(ox - k * 0.34, oy - k * 0.40, k * 0.05, ox, oy, k * 1.02);
      g.addColorStop(0.00, '#2F7FC2');
      g.addColorStop(0.45, '#17598F');
      g.addColorStop(0.80, '#0C3559');
      g.addColorStop(1.00, '#061F37');
      ctx.fillStyle = g; ctx.fill();
      ctx.clip();
    }

    /* ---------- continental shelf glow ---------- */
    if (detail && !S.only) {
      ctx.lineJoin = 'round'; ctx.lineCap = 'round';
      /* the halo is a fixed screen width, not a fraction of the globe,
         so zooming in does not inflate it into a blue smear */
      const shelf = [
        [Math.min(9, Math.max(4, k * 0.022)), 'rgba(90,175,225,0.20)'],
        [Math.min(4, Math.max(2, k * 0.010)), 'rgba(126,204,238,0.26)']
      ];
      for (const [lw, col] of shelf) {
        ctx.lineWidth = lw; ctx.strokeStyle = col;
        for (const n in paths.__ctx) ctx.stroke(paths.__ctx[n]);
        for (const c in paths) { if (c !== '__ctx') ctx.stroke(paths[c]); }
      }
    }

    /* ---------- land ---------- */
    const spot = !!(S.focus && paths[S.focus]);
    if (S.showContext) {
      for (const n in paths.__ctx) {
        ctx.fillStyle = spot ? CTXM[n] : CTXC[n];
        ctx.fill(paths.__ctx[n]);
      }
    }

    for (const c in paths) {
      if (c === '__ctx') continue;
      const st = S.paint[c];
      if (st) {
        ctx.globalAlpha = 1;
        ctx.fillStyle = T[st] || st;
        if (detail) { ctx.shadowColor = T[st] || st; ctx.shadowBlur = Math.min(14, Math.max(5, k * 0.02)); }
        ctx.fill(paths[c]);
        ctx.shadowBlur = 0;
      } else if (S.dim && !S.dim.has(c)) {
        ctx.globalAlpha = 0.4;
        ctx.fillStyle = spot ? LANDM[c] : LANDC[c];
        ctx.fill(paths[c]);
        ctx.globalAlpha = 1;
      } else {
        ctx.globalAlpha = 1;
        ctx.fillStyle = spot ? LANDM[c] : LANDC[c];
        ctx.fill(paths[c]);
      }
    }
    ctx.globalAlpha = 1;

    /* ---------- borders ---------- */
    if (!S.only) {
      ctx.lineWidth = Math.max(0.5, Math.min(1.1, k * 0.0022));
      ctx.strokeStyle = 'rgba(12,20,30,0.42)';
      for (const n in paths.__ctx) ctx.stroke(paths.__ctx[n]);
      ctx.strokeStyle = 'rgba(250,252,255,0.34)';
      for (const c in paths) { if (c !== '__ctx') ctx.stroke(paths[c]); }
    }

    /* ---------- graticule, faint, over the surface ---------- */
    if (detail && !S.only) {
      ctx.strokeStyle = 'rgba(255,255,255,0.09)';
      ctx.lineWidth = 0.6;
      ctx.beginPath();
      for (let lat = -60; lat <= 60; lat += 30) {
        let first = true;
        for (let lon = -180; lon <= 180; lon += 4) {
          const q = P.fwd(lon, lat, S.rot);
          if (!q[2]) { first = true; continue; }
          const x = q[0] * k + ox, y = q[1] * k + oy;
          if (first) { ctx.moveTo(x, y); first = false; } else ctx.lineTo(x, y);
        }
      }
      for (let lon = -180; lon < 180; lon += 30) {
        let first = true;
        for (let lat = -85; lat <= 85; lat += 4) {
          const q = P.fwd(lon, lat, S.rot);
          if (!q[2]) { first = true; continue; }
          const x = q[0] * k + ox, y = q[1] * k + oy;
          if (first) { ctx.moveTo(x, y); first = false; } else ctx.lineTo(x, y);
        }
      }
      ctx.stroke();
    }

    /* ---------- markers for shapes too small to see ---------- */
    for (const c in paths) {
      if (c === '__ctx') continue;
      const st = S.paint[c];
      const wanted = st || (S.markers && S.markers.has(c));
      if (!wanted) continue;
      const m = META[c];
      const px = m.span * k * (globe ? 0.017 : 0.0055);
      if (px > 9) continue;
      const q = P.fwd(m.lon, m.lat, S.rot);
      if (!q[2]) continue;
      const x = q[0] * k + ox, y = q[1] * k + oy;
      ctx.beginPath(); ctx.arc(x, y, st ? 5.5 : 3.2, 0, 7);
      ctx.fillStyle = st ? (T[st] || st) : 'rgba(255,255,255,0.82)';
      ctx.fill();
      ctx.lineWidth = 1.4; ctx.strokeStyle = 'rgba(8,16,28,0.55)'; ctx.stroke();
    }

    /* ---------- sphere shading, inside the clip ---------- */
    if (globe) {
      const lx = ox - k * 0.34, ly = oy - k * 0.40;
      ctx.globalCompositeOperation = 'multiply';
      const sh = ctx.createRadialGradient(lx, ly, k * 0.06, ox, oy, k * 1.42);
      sh.addColorStop(0.00, 'rgb(255,255,255)');
      sh.addColorStop(0.40, 'rgb(226,232,241)');
      sh.addColorStop(0.72, 'rgb(126,142,168)');
      sh.addColorStop(1.00, 'rgb(28,40,62)');
      ctx.fillStyle = sh;
      ctx.beginPath(); ctx.arc(ox, oy, k, 0, 7); ctx.fill();

      ctx.globalCompositeOperation = 'lighter';
      const sp = ctx.createRadialGradient(lx, ly, 0, lx, ly, k * 0.78);
      sp.addColorStop(0, 'rgba(150,196,255,0.14)');
      sp.addColorStop(1, 'rgba(150,196,255,0)');
      ctx.fillStyle = sp;
      ctx.beginPath(); ctx.arc(ox, oy, k, 0, 7); ctx.fill();
      ctx.globalCompositeOperation = 'source-over';
    }
    ctx.restore();

    /* ---------- limb ---------- */
    if (globe) {
      ctx.beginPath(); ctx.arc(ox, oy, k, 0, 7);
      ctx.strokeStyle = 'rgba(150,200,255,0.45)'; ctx.lineWidth = 1.1; ctx.stroke();
    }

    /* ---------- spotlight ----------
       Painted after the sphere shading so the night side can never dim the
       one country you are being asked about, and ringed so a speck like
       Fiji is as findable as Australia. */
    if (S.focus && paths[S.focus] && !S.only) {
      const col = (S.paint[S.focus] && T[S.paint[S.focus]]) || T.ask || '#FFC300';
      const m2 = META[S.focus];

      ctx.save();
      if (globe) { ctx.beginPath(); ctx.arc(ox, oy, k, 0, 7); ctx.clip(); }
      ctx.shadowColor = col; ctx.shadowBlur = 20;
      ctx.fillStyle = col;
      ctx.fill(paths[S.focus]); ctx.fill(paths[S.focus]);
      ctx.shadowBlur = 0;
      ctx.lineWidth = 1.4; ctx.strokeStyle = 'rgba(28,22,0,0.75)';
      ctx.stroke(paths[S.focus]);
      ctx.restore();

      const q = P.fwd(m2.lon, m2.lat, S.rot);
      const apparent0 = globe ? m2.span * k / 114.6 : m2.span * k / 360;
      /* a country big enough to see on its own does not need a sight ring */
      if (q[2] && apparent0 < 150) {
        const x = q[0] * k + ox, y = q[1] * k + oy;
        const apparent = apparent0;
        const R = Math.max(28, apparent * 0.78 + 16);

        const now = performance.now();
        if (now < pulseUntil) {
          const ph = ((pulseUntil - now) % 1300) / 1300;      /* 0..1 */
          const rr = R + 4 + (1 - ph) * 26;
          ctx.beginPath(); ctx.arc(x, y, rr, 0, 7);
          ctx.strokeStyle = col; ctx.globalAlpha = 0.45 * ph;
          ctx.lineWidth = 3; ctx.stroke();
          ctx.globalAlpha = 1;
        }

        ctx.beginPath(); ctx.arc(x, y, R, 0, 7);
        ctx.strokeStyle = 'rgba(0,0,0,0.35)'; ctx.lineWidth = 5; ctx.stroke();
        ctx.strokeStyle = col; ctx.lineWidth = 2.6; ctx.stroke();

        /* four ticks, so the ring reads as a sight rather than a bubble */
        ctx.strokeStyle = col; ctx.lineWidth = 2.2; ctx.lineCap = 'round';
        for (let a = 0; a < 4; a++) {
          const th = a * Math.PI / 2 + Math.PI / 4;
          ctx.beginPath();
          ctx.moveTo(x + Math.cos(th) * (R + 3), y + Math.sin(th) * (R + 3));
          ctx.lineTo(x + Math.cos(th) * (R + 10), y + Math.sin(th) * (R + 10));
          ctx.stroke();
        }
      }
    }

    /* ---------- labels ----------
       A pill sitting on a country hides the very shape you are trying to
       learn, and a bounding box is no guide: Moldova, Chile and Vietnam are
       all wider than their name and still vanish underneath it. So the pill
       only stays put when it lands wholly on land with room to spare —
       otherwise it moves off the shape and a leader line points back. */
    if (S.labels.length) {
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      const placed = [];
      const hits = (a) => placed.some(b =>
        a.x0 < b.x1 + 4 && a.x1 > b.x0 - 4 && a.y0 < b.y1 + 4 && a.y1 > b.y0 - 4);
      const overlaps = (a, b, pad) =>
        a.x0 < b.x1 + pad && a.x1 > b.x0 - pad && a.y0 < b.y1 + pad && a.y1 > b.y0 - pad;

      for (const L of S.labels) {
        const m = META[L.code]; if (!m) continue;
        if (S.only && !S.only.has(L.code)) continue;
        const q = P.fwd(m.lon, m.lat, S.rot);
        if (!q[2]) continue;
        const x = q[0] * k + ox, y = q[1] * k + oy;
        const fs = L.size || 13;
        ctx.font = (L.bold ? '600 ' : '500 ') + fs + 'px ' + (T.font || 'system-ui');
        const tw = ctx.measureText(L.text).width;
        const pad = 5, h = fs + 7, w = tw + pad * 2;

        /* the shape exactly as drawn: its main landmass, in screen pixels */
        const bx = pbox[L.code];
        const aw = bx ? bx.x1 - bx.x0 : 0, ah = bx ? bx.y1 - bx.y0 : 0;
        const apparent = Math.max(aw, ah);
        const path = paths[L.code];

        /* Can the pill sit on the country? Only if the outline is clearly
           bigger than it and every corner of the pill is on land, so a thin
           country never disappears under its own name. */
        /* device pixels: isPointInPath does not apply the DPR transform */
        const onLand = (px2, py2) => ctx.isPointInPath(path, px2 * DPR, py2 * DPR);
        /* Does a pill at this box sit on any part of the country? Every ring
           counts, so an outlying island is not quietly buried either. */
        const onShape = (b2) => {
          if (!bx || !overlaps(b2, bx.all, 4)) return false;
          for (const r of bx.rings) if (overlaps(b2, r, 4)) return true;
          return false;
        };

        let inside = false;
        if (path && bx && aw > w * 1.6 + 16 && ah > h * 2.4 + 12) {
          inside = true;
          const hw = w / 2 + 6, hh = h / 2 + 5;
          for (let i = 0; i <= 4 && inside; i++) {
            for (let j = 0; j <= 2; j++) {
              if (!onLand(x - hw + (hw * 2) * (i / 4), y - hh + (hh * 2) * (j / 2))) {
                inside = false; break;
              }
            }
          }
        }

        let lx = x, ly = y, lead = false;
        if (!inside) {
          /* keep off the shape itself, and off the sight ring when spotlit */
          const halo = bx ? { x0: bx.x0, y0: bx.y0, x1: bx.x1, y1: bx.y1 }
                          : { x0: x - 4, y0: y - 4, x1: x + 4, y1: y + 4 };
          /* the sight ring, on the same terms the spotlight draws it */
          const app0 = m.span * k / (globe ? 114.6 : 360);
          if (S.focus === L.code && !S.only && app0 < 150) {
            const R = Math.max(28, app0 * 0.78 + 16);
            halo.x0 = Math.min(halo.x0, x - R); halo.x1 = Math.max(halo.x1, x + R);
            halo.y0 = Math.min(halo.y0, y - R); halo.y1 = Math.max(halo.y1, y + R);
          }
          const rx2 = (halo.x1 - halo.x0) / 2, ry2 = (halo.y1 - halo.y0) / 2;
          const cx0 = (halo.x0 + halo.x1) / 2, cy0 = (halo.y0 + halo.y1) / 2;
          /* ring search: nearest free slot, stepping further out if crowded */
          const dirs = [[0,-1],[1,-0.75],[-1,-0.75],[1,-0.2],[-1,-0.2],[0,1],
                        [1,0.75],[-1,0.75],[0.6,-1],[-0.6,-1],[0.6,1],[-0.6,1]];
          let best = null;
          for (const mul of [1, 1.25, 1.6, 2.1, 2.8]) {
            for (const d of dirs) {
              const cx2 = cx0 + d[0] * (rx2 + w / 2 + 14) * mul;
              const cy2 = cy0 + d[1] * (ry2 + h / 2 + 12) * mul;
              const box = { x0: cx2 - w/2, x1: cx2 + w/2, y0: cy2 - h/2, y1: cy2 + h/2 };
              if (box.x0 < 2 || box.y0 < 2 || box.x1 > W - 2 || box.y1 > H - 2) continue;
              if (hits(box) || overlaps(box, halo, 6)) continue;
              /* islands and exclaves live outside the main box, so the pill
                 gets tested against the shape itself, not just its box */
              if (onShape(box)) continue;
              best = { cx: cx2, cy: cy2, box: box }; break;
            }
            if (best) break;
          }
          /* Chile-shaped countries can fill the screen top to bottom and leave
             no slot on the ring; sweep the whole canvas for the closest gap. */
          if (!best) {
            let bd = 1e9;
            const step = Math.max(12, Math.min(w, h) / 2);
            for (let cy2 = h/2 + 2; cy2 <= H - h/2 - 2; cy2 += step) {
              for (let cx2 = w/2 + 2; cx2 <= W - w/2 - 2; cx2 += step) {
                const box = { x0: cx2 - w/2, x1: cx2 + w/2, y0: cy2 - h/2, y1: cy2 + h/2 };
                const dist = Math.hypot(cx2 - x, cy2 - y);
                if (dist >= bd) continue;
                if (hits(box) || overlaps(box, halo, 2) || onShape(box)) continue;
                bd = dist; best = { cx: cx2, cy: cy2, box: box };
              }
            }
          }
          if (!best) {
            const cx2 = Math.max(w/2 + 2, Math.min(W - w/2 - 2, x));
            const cy2 = Math.max(h/2 + 2, Math.min(H - h/2 - 2, halo.y0 - h/2 - 12));
            best = { cx: cx2, cy: cy2, box: { x0: cx2-w/2, x1: cx2+w/2, y0: cy2-h/2, y1: cy2+h/2 } };
          }
          lx = best.cx; ly = best.cy; lead = true;
          placed.push(best.box);
        } else {
          placed.push({ x0: x-w/2, x1: x+w/2, y0: y-h/2, y1: y+h/2 });
        }

        if (lead) {
          /* start at the pill edge, stop where the line first touches land,
             so it reads as a pointer and never lies across the country */
          const dx = x - lx, dy = y - ly, len = Math.hypot(dx, dy) || 1;
          const ux2 = dx / len, uy2 = dy / len;
          const tx = Math.abs(ux2) > 1e-6 ? (w / 2 + 1) / Math.abs(ux2) : 1e9;
          const ty = Math.abs(uy2) > 1e-6 ? (h / 2 + 1) / Math.abs(uy2) : 1e9;
          const start = Math.min(tx, ty);
          let ex2 = len;
          if (path) {
            for (let t = start; t <= len; t += 2) {
              if (ctx.isPointInPath(path, (lx + ux2 * t) * DPR, (ly + uy2 * t) * DPR)) { ex2 = t; break; }
            }
          }
          ex2 = Math.max(start, ex2 - 1);
          if (ex2 > start + 1) {
            ctx.beginPath();
            ctx.moveTo(lx + ux2 * start, ly + uy2 * start);
            ctx.lineTo(lx + ux2 * ex2, ly + uy2 * ex2);
            ctx.lineWidth = 2.6; ctx.strokeStyle = 'rgba(6,12,22,0.55)'; ctx.stroke();
            ctx.lineWidth = 1.2; ctx.strokeStyle = L.color || 'rgba(255,255,255,0.85)'; ctx.stroke();
          }
          /* a speck gets a ring too, so the line has something to land on */
          if (apparent < 14) {
            ctx.beginPath(); ctx.arc(x, y, Math.max(3.5, apparent / 2 + 2.5), 0, 7);
            ctx.lineWidth = 2.4; ctx.strokeStyle = 'rgba(6,12,22,0.55)'; ctx.stroke();
            ctx.lineWidth = 1.2; ctx.strokeStyle = L.color || 'rgba(255,255,255,0.85)'; ctx.stroke();
          }
        }

        ctx.fillStyle = 'rgba(6,12,22,0.78)';
        roundRect(ctx, lx - w / 2, ly - h / 2, w, h, h / 2);
        ctx.fill();
        ctx.strokeStyle = 'rgba(255,255,255,0.16)'; ctx.lineWidth = 0.7; ctx.stroke();
        ctx.fillStyle = L.color || '#fff';
        ctx.fillText(L.text, lx, ly + 0.5);
      }
    }
  }

  function roundRect(c, x, y, w, h, r) {
    c.beginPath();
    c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r);
    c.arcTo(x + w, y + h, x, y + h, r); c.arcTo(x, y + h, x, y, r);
    c.arcTo(x, y, x + w, y, r); c.closePath();
  }

  function setFocus(code) {
    S.focus = code || null;
    cancelAnimationFrame(pulseId); pulseId = 0;

/* ===================== state ===================== */
const LS = 'atlas-v1';
const BOXES = [0, 25*60e3, 4*3600e3, 24*3600e3, 3*24*3600e3, 8*24*3600e3];
const MASTER = 4;

const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };
const lsDel = k => { try { localStorage.removeItem(k); } catch (e) {} };
let prog = {};
try { prog = JSON.parse(lsGet(LS)) || {}; } catch (e) { prog = {}; }
const P = c => prog[c] || (prog[c] = { b: 0, d: 0, r: 0, w: 0, s: 0 });
const save = () => lsSet(LS, JSON.stringify(prog));
function grade(c, ok) {
  const p = P(c); p.s++;
  if (ok) { p.r++; p.b = Math.min(5, p.b + 1); } else { p.w++; p.b = Math.max(0, p.b - 1); }
  p.d = Date.now() + BOXES[p.b]; save();
}
const seen   = c => !!prog[c] && prog[c].s > 0;
const master = c => !!prog[c] && prog[c].b >= MASTER;
const due    = c => seen(c) && (prog[c].d || 0) <= Date.now() && !master(c);

const DATA = window.DATA;
const C = DATA.c, MODS = DATA.m;
const MOD_OF = {}; MODS.forEach(m => m.codes.forEach(c => MOD_OF[c] = m));
const ALL = MODS.flatMap(m => m.codes);
const dueList = () => ALL.filter(due);
const seenList = () => ALL.filter(seen);

const TINT = ['var(--blue)','var(--indigo)','var(--teal)','var(--orange)','var(--green)',
              'var(--pink)','var(--red)','var(--blue)','var(--indigo)','var(--teal)','var(--orange)'];

/* ===================== native bridge (iOS shell) ===================== */
const NATIVE = !!(window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.atlas);

  if (!NATIVE) return false;
  try { window.webkit.messageHandlers.atlas.postMessage(Object.assign({ name }, payload || {})); return true; }
  catch (e) { return false; }

}

/* ===================== voice =====================
   Every country, capital and region was rendered once with a neural
   voice and shipped with the app, grouped into one audio sprite per
   module. The device's own text-to-speech is only a fallback for
   phrases that have no recording. */
const synth = window.speechSynthesis || null;
let voice = null, sound = lsGet('atlas-sound') !== '0';

const NICE = ['Google UK English Female', 'Google UK English Male', 'Google US English',
  'Samantha', 'Serena', 'Daniel', 'Karen', 'Tessa', 'Moira', 'Fiona', 'Alex', 'Allison'];

function voiceScore(v) {
  const n = v.name || '', l = (v.lang || '').replace('_', '-');
  let s = 0;
  if (/natural|neural|premium|enhanced/i.test(n)) s += 300;
  if (/siri/i.test(n)) s += 200;
  const i = NICE.indexOf(n);
  if (i >= 0) s += 120 - i * 4;
  if (l === 'en-GB') s += 40;
  else if (l === 'en-US') s += 34;
  else if (l === 'en-AU' || l === 'en-IE') s += 24;
  else if (l.startsWith('en')) s += 10;
  else s -= 200;
  if (/compact|eloquence|novelty|whisper|bells|bubbles|zarvox|trinoids/i.test(n)) s -= 400;
  return s;
}

  if (!synth) return;
  const v = synth.getVoices();

  voice = v.slice().sort((a, b) => voiceScore(b) - voiceScore(a))[0] || null;

   from a cache, a file:// bundle or a plain static host it often cannot. A
   decoded buffer plays any slice exactly, offline, with no server semantics. */

  .then(r => r.ok ? r.json() : null)
  .then(j => { VOICES = j || {}; })

    .then(r => { if (!r.ok) throw new Error('missing'); return r.arrayBuffer(); })
    .then(ab => new Promise((res, rej) => {

  queue = [];
  stopNode();
  if (synth) { try { synth.cancel(); } catch (e) {} }
}
function drain() {
  if (node || !queue.length) return;
  const next = queue.shift();
  if (next) playOne(next.id, next.fallback);
}
function playOne(id, fallback) {
  const c = clipOf(id);
  if (!c) return ttsSpeak(fallback);
  loadGroup(c.g).then(buf => {
    const ctx = audioCtx();
    if (!ctx) return ttsSpeak(fallback);
    stopNode();
    const src = ctx.createBufferSource();
    src.buffer = buf;
    src.connect(ctx.destination);
    src.onended = () => { if (node === src) { node = null; drain(); } };
    node = src;
    src.start(0, c.start, c.dur);
  }).catch(() => ttsSpeak(fallback));
}
function ttsSpeak(t) {
  if (!synth || !t) return;
  try {
    if (!voice) pickVoice();
    synth.cancel();
    const u = new SpeechSynthesisUtterance(t);
    if (voice) { u.voice = voice; u.lang = voice.lang; }
    u.rate = 0.95; u.pitch = 1.0; u.volume = 1;
    setTimeout(() => { try { synth.speak(u); } catch (e) {} }, 30);
  } catch (e) {}
}

/* say('c:FR') plays the recording; say(null, 'text') falls back to the
   device voice; an array plays clips back to back. */
function say(id, fallback) {
  if (!sound) return;
  stopVoice();
  if (Array.isArray(id)) {
    queue = id.slice(1).map(x => ({ id: x, fallback: '' }));
    playOne(id[0], fallback);
  } else if (id) {
    playOne(id, fallback);
  } else {
    ttsSpeak(fallback);
  }
}
function warmVoice(g) { if (VOICES && VOICES[g]) loadGroup(g).catch(() => {}); }

/* iOS will not start audio until a gesture has touched the context */
addEventListener('pointerdown', function unlock() {
  removeEventListener('pointerdown', unlock);
  audioCtx();
}, { once: true, passive: true });

const speak = t => say(null, t);      /* legacy text path */

const spk = (id, lbl, fb) => `<button class="spk" data-clip="${esc(id)}" data-say="${esc(fb || lbl || '')}" aria-label="Pronounce ${esc(lbl || '')}">${SPK}</button>`;
const CHEV = `<svg class="chev" viewBox="0 0 8 13" aria-hidden="true"><path d="M1.5 1.5 6.5 6.5 1.5 11.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>`;

const shuffle = a => { a = a.slice(); for (let i = a.length-1; i > 0; i--) { const j = (Math.random()*(i+1))|0; [a[i],a[j]] = [a[j],a[i]]; } return a; };
const nm = c => C[c] ? C[c].n : c;
const sayCountry = c => C[c] ? C[c].s.split(' / ')[0] : '';

/* ===================== shared quiz primitives ===================== */
const listJoin = a => a.length < 2 ? (a[0] || '') :
  a.slice(0, -1).join(', ') + (a.length > 2 ? ',' : '') + ' and ' + a[a.length - 1];

/* Distractors must be plausible: neighbours first, then the same module,
   then anywhere. A silhouette of Italy against Samoa teaches nothing. */
function optionsFor(c, n, pref) {
  const out = [c], push = x => { if (x !== c && C[x] && out.indexOf(x) < 0 && out.length < n) out.push(x); };
  const mod = MOD_OF[c] ? MOD_OF[c].codes : ALL;
  const p = pref || [];
  shuffle(p.filter(x => mod.indexOf(x) >= 0)).forEach(push);
  shuffle(mod).forEach(push);
  shuffle(p).forEach(push);
  shuffle(ALL).forEach(push);
  return shuffle(out);
}

/* every question routes through here */
let ITEM = null;

/* The camera parks on a framing that shows the whole module and STAYS there
   for every question in it. Only a country too small to see at that framing
   earns a closer look, and the next normal question returns to the anchor. */
/* One zoom for the whole run, set on the first question and never changed:
   from then on the map only turns to the country being asked about. Re-fitting
   the frame per question made it lurch out to the whole module halfway through
   a lesson, and you do not need Russia on screen to answer about the UK.
   A speck stays findable on its own terms — marker, spotlight and sight ring. */
function holdFrame(item, target) {
  const scope = (item.scope && item.scope.length) ? item.scope : [target];
  if (V.zoom == null) V.zoom = map.zoomForRun(scope);
  map.flyTo([target], { zoom: V.zoom });
}

function ask(item) {
  ITEM = item;
  V.lock = false;
  clearTimeout(V.t1);
  const c = item.c;
  map.S.paint = {}; map.S.labels = []; map.S.onPick = null;
  map.S.only = null; map.S.showContext = true;
  map.S.dim = item.scope ? new Set(item.scope) : null;
  map.S.markers = item.scope ? new Set(item.scope) : new Set([c]);
  map.setFocus(null);

  if (item.k === 'find') {
    if (item.help) {
      map.S.labels = (item.scope || []).filter(x => x !== c && seen(x))
        .slice(0, 8).map(x => ({ code: x, text: nm(x), size: 12 }));
    }
    holdFrame(item, c);
    map.S.onPick = picked => {
      if (V.lock) return;
      /* Every tap gets an answer. Silence reads as a broken app. */
      if (!picked) return nudge('That is open water \u2014 tap the country itself.');
      const inScope = !item.scope || item.scope.indexOf(picked) >= 0;
      if (!inScope && picked !== c) {
        return nudge('That is ' + esc(nm(picked)) + ', which is not in this module. Try again.');
      }
      judge(picked === c, c, picked);
    };
    shell(`<div class="ask">Find ${esc(nm(c))} ${spk('c:' + c, nm(c), nm(c))}</div>
      <p class="asksub">Tap it on the map${item.help ? '' : ' &mdash; no labels this time'}.</p>
      <div class="fb" id="fb"></div>`);
    say('c:' + c, nm(c));
    return;
  }

  if (item.k === 'name' || item.k === 'shape') {
    if (item.k === 'shape') {
      map.S.only = new Set([c]);
      map.S.showContext = false;
      map.S.dim = null;
      map.S.markers = new Set([c]);
      map.S.paint[c] = 'ask';
      map.flyTo([c], { zoom: map.zoomForFocus(c, [c]) });
    } else {
      map.S.paint[c] = 'ask';
      holdFrame(item, c);
      map.setFocus(c);
    }
    const opts = optionsFor(c, 4, item.pool);
    shell(`<div class="ask">${item.k === 'shape' ? 'Which country is this shape?' : 'Which country is highlighted?'}</div>
      ${item.k === 'shape' ? '<p class="asksub">No borders, no neighbours, no labels.</p>' : ''}
      <div class="opts">${opts.map(x => `<button class="opt" data-pick="${x}">${esc(nm(x))}</button>`).join('')}</div>
      <div class="fb" id="fb"></div>`);
    return;
  }

  if (item.k === 'cap') {
    map.S.paint[c] = 'ask';
    holdFrame(item, c);
    map.setFocus(c);
    const opts = optionsFor(c, 4, item.pool);
    shell(`<div class="ask">Capital of ${esc(nm(c))} ${spk('c:' + c, nm(c), nm(c))}</div>
      <div class="opts">${opts.map(x => `<button class="opt" data-pick="${x}">${esc(C[x].c)}</button>`).join('')}</div>
      <div class="fb" id="fb"></div>`);
    return;
  }

  if (item.k === 'say') {
    map.S.paint[c] = 'ask';
    holdFrame(item, c);
    map.setFocus(c);
    const opts = optionsFor(c, 4, item.pool);
    shell(`<div class="ask">Which one is said &ldquo;${esc(sayCountry(c))}&rdquo;? ${spk('c:' + c, nm(c), nm(c))}</div>
      <div class="opts">${opts.map(x => `<button class="opt" data-pick="${x}">${esc(nm(x))}</button>`).join('')}</div>
      <div class="fb" id="fb"></div>`);
    say('c:' + c, nm(c));
    return;
  }
}

/* wraps question body in the right chrome for lesson vs endless quiz */
function shell(body) {
  if (V.s === 'lesson') {
    nav(`<div class="tag">${esc(V.ch.t)} &middot; ${V.right + V.wrong} answered</div>${body}
      <div class="btns"><button class="bt p" id="cont" data-go="next" hidden>Next</button></div>`,
      { back: V.m.name, title: 'Lesson ' + (V.k + 1) });

  } else {

      { back: V.backLabel || 'Atlas', title: V.title,

/* A miss that should not cost a point: says what happened, keeps the question live. */
let nudgeTimer = 0;
function nudge(msg) {
  const fb = $('#fb');
  if (!fb) return;
  haptic('wrong');
  fb.innerHTML = '<b style="color:var(--label2)">' + msg + '</b>';
  clearTimeout(nudgeTimer);
  nudgeTimer = setTimeout(() => { if (fb.isConnected && !V.lock) fb.innerHTML = ''; }, 2600);
}

function judge(ok, c, picked) {
  if (V.lock) return;
  V.lock = true;
  grade(c, ok);
  V.right += ok ? 1 : 0;
  V.wrong += ok ? 0 : 1;
  if (!ok) { if (V.missed) V.missed.add ? V.missed.add(c) : (V.missed[c] = 1); }

  map.S.paint = {};
  map.S.paint[c] = 'hit';
  if (!ok && picked && picked !== c) map.S.paint[picked] = 'miss';
  map.S.labels = [{ code: c, text: nm(c), size: 13, bold: true }];
  if (!ok && picked && picked !== c) map.S.labels.push({ code: picked, text: nm(picked), size: 12 });
  map.setFocus(c);

  document.querySelectorAll('.opt').forEach(b => {
    if (b.dataset.pick === c) b.classList.add('ok');
    else if (b.dataset.pick === picked) b.classList.add('no');
  });

  const fb = $('#fb');
  if (fb) {
    fb.innerHTML = ok
      ? `<b class="ok">Right.</b> ${esc(nm(c))} &middot; ${esc(C[c].c)} ${spk('p:' + c, C[c].c, C[c].c)}<i>${esc(C[c].h)}</i>`
      : `<b class="no">Not quite.</b> That was ${esc(nm(c))}${picked && picked !== c ? ` &mdash; you picked ${esc(nm(picked))}` : ''}. ${spk('c:' + c, nm(c), nm(c))}<i>${esc(C[c].h)}</i>`;
  }
  say('c:' + c, nm(c));

  haptic(ok ? 'right' : 'wrong');
  native('progress', { mastered: ALL.filter(master).length, total: ALL.length, due: dueList().length });
  const b = $('#cont');
  if (b) { b.hidden = false; b.textContent = ok ? 'Next' : 'Got it'; }
  if (ok && V.s !== 'lesson') V.t1 = setTimeout(() => { if (V.lock) advance(); }, 950);
  if (ok && V.s === 'lesson') V.t1 = setTimeout(() => { if (V.lock) advance(); }, 1100);
}

function advance() {
  clearTimeout(V.t1);
  if (V.s === 'lesson') { V.i++; runStep(); }
  else nextQuestion();
}

/* ===================== LESSON ===================== */
function buildSteps(m, k) {
  const ch = m.ch[k], cs = ch.codes;
  const steps = [{ k: 'orient' }];
  cs.forEach(c => steps.push({ k: 'meet', c }));
  shuffle(cs).forEach(c => steps.push({ k: 'find', c, help: true, scope: cs }));
  shuffle(cs).forEach(c => steps.push({ k: 'name', c, pool: cs, scope: cs }));
  const earlier = m.ch.slice(0, k).reduce((a, x) => a.concat(x.codes), []).filter(seen);
  const mix = shuffle(cs.concat(shuffle(earlier).slice(0, Math.min(5, earlier.length))));
  mix.forEach(c => steps.push({ k: 'find', c, help: false, scope: m.codes }));
  steps.push({ k: 'done' });
  return steps;
}

function openLesson(mid, k) {
  const m = MODS.find(x => x.id === mid); if (!m) return home();
  const ch = m.ch[k]; if (!ch) return openModule(mid);
  V = { s: 'lesson', mid, k, m, ch, steps: buildSteps(m, k), i: 0,
        right: 0, wrong: 0, missed: new Set(), lock: false };
  runStep();
}

function runStep() {
  const st = V.steps[V.i];
  if (!st) return lessonDone();
  setProgress(V.i / V.steps.length);
  if (st.k === 'orient') return stepOrient();
  if (st.k === 'meet') return stepMeet(st.c);
  if (st.k === 'done') return lessonDone();
  ask(st);
}

function stepOrient() {
  const cs = V.ch.codes;
  map.setFocus(null);
  map.S.only = null; map.S.showContext = true; map.S.onPick = null;
  map.S.dim = new Set(V.m.codes); map.S.markers = new Set(cs);
  map.S.paint = {}; cs.forEach(c => map.S.paint[c] = 'on');
  map.S.labels = cs.map(c => ({ code: c, text: nm(c), size: 13, bold: true }));
  map.flyToFrame(cs);
  const names = cs.map(nm);
  nav(`<div class="tag">Lesson ${V.k + 1} of ${V.m.ch.length}</div>
    <div class="card">
      <div class="cname">${esc(V.ch.t)} ${spk('r:' + V.mid + ':' + V.k, V.ch.t, V.ch.t)}</div>
      <p class="sub" style="margin-top:10px">${cs.length === 1 ? 'One country' : cs.length + ' countries'} &middot; ${esc(V.m.name)}</p>
      <div class="chips">${cs.map(c => `<span class="chip">${esc(nm(c))}</span>`).join('')}</div>
      <div class="hook">${esc(V.m.blurb)}</div>
    </div>
    <p class="foot">Look at the highlighted shapes before you move on. You will be asked to find them with no labels in a minute.</p>
    <div class="btns"><button class="bt p" data-go="next">Meet ${cs.length === 1 ? 'it' : 'them'}</button></div>`,
    { back: V.m.name, title: 'Lesson ' + (V.k + 1) });
  say(['r:' + V.mid + ':' + V.k].concat(cs.map(x => 'c:' + x)), V.ch.t);
}

function stepMeet(c) {
  map.S.only = null; map.S.showContext = true; map.S.onPick = null;
  map.S.dim = new Set(V.m.codes); map.S.markers = new Set(V.ch.codes);
  map.S.paint = {}; map.S.paint[c] = 'on';
  map.S.labels = [{ code: c, text: nm(c), size: 14, bold: true }];
  holdFrame({ scope: V.ch.codes }, c);
  map.setFocus(c);
  nav(`<div class="tag">New country</div>
    <div class="card">
      <div class="cname">${esc(nm(c))} ${spk('c:' + c, nm(c), nm(c))}</div>
      <p class="say">${esc(sayCountry(c))}</p>
      <div class="kv"><span class="k">Capital</span><span class="v">${esc(C[c].c)} ${spk('p:' + c, C[c].c, C[c].c)}</span></div>
      <div class="kv"><span class="k">Say</span><span class="v" style="font-weight:400;font-style:italic;color:var(--label2)">${esc(sayCapital(c))}</span></div>
      <div class="hook">${esc(C[c].h)}</div>
    </div>
    <div class="btns"><button class="bt p" data-go="next">Got it</button></div>`,
    { back: V.m.name, title: 'Lesson ' + (V.k + 1) });
  say(['c:' + c, 'p:' + c], nm(c));
}

function lessonDone() {
  map.setFocus(null);
  const cs = V.ch.codes, tot = V.right + V.wrong;
  const pct = tot ? Math.round(V.right / tot * 100) : 100;
  const missed = Array.from(V.missed);
  const mastered = cs.filter(master).length;
  const next = V.k + 1 < V.m.ch.length ? V.k + 1 : null;
  map.S.paint = {}; map.S.labels = []; map.S.onPick = null;
  cs.forEach(c => map.S.paint[c] = master(c) ? 'known' : 'on');
  map.S.labels = cs.map(c => ({ code: c, text: nm(c), size: 12 }));
  map.flyTo(cs);
  setProgress(1);
  nav(`<div class="pad"><h1 class="large">${pct === 100 ? 'Clean run.' : 'Lesson done.'}</h1>
    <p class="sub">${esc(V.ch.t)}</p></div>
    <div class="stats">
      <div><i>${V.right}</i><em>right</em></div>
      <div><i>${V.wrong}</i><em>wrong</em></div>
      <div><i>${pct}%</i><em>accuracy</em></div>
      <div><i>${mastered}/${cs.length}</i><em>mastered</em></div>
    </div>
    ${missed.length ? `<div class="ghead">Slipped on</div><div class="weak">${missed.map(c => `<span>${esc(nm(c))}</span>`).join('')}</div>` : ''}
    <p class="foot">${mastered === cs.length
      ? 'All of these are in the mastered pile. They will come back for review on a spacing schedule so they stick.'
      : 'Mastery needs several correct answers spread over time, so keep quizzing &mdash; these will resurface in Review.'}</p>
    <div class="btns">
      <button class="bt p" data-go="quiz-chunk">Quiz these, endlessly</button>
      ${next !== null ? `<button class="bt" data-lesson="${next}">Next lesson</button>` : ''}
      <button class="bt" data-go="module">Back to ${esc(V.m.name)}</button>
    </div>`, { back: V.m.name, title: 'Done' });
}

/* ===================== ENDLESS QUIZ ===================== */
const KINDS = ['find', 'name', 'find', 'shape', 'name', 'say'];

function startQuiz(codes, title, opts) {
  opts = opts || {};
  codes = codes.filter(c => C[c]);
  if (!codes.length) return home();
  V = { s: opts.speed ? 'speed' : 'quiz', codes, title, mid: opts.mid || null,
        backLabel: opts.backLabel || 'Atlas', right: 0, wrong: 0, missed: new Set(),
        lock: false, last: null, kindI: 0 };
  if (opts.speed) {
    V.timeLeft = 60;
    V.clock = setInterval(() => {
      V.timeLeft--;
      const t = $('.tag'); if (t) t.innerHTML = `Speed round &middot; ${V.right} right &middot; ${V.timeLeft}s`;
      if (V.timeLeft <= 0) { clearInterval(V.clock); speedDone(); }
    }, 1000);
  }
  nextQuestion();
}

function pickCode() {
  const pool = V.codes;
  if (pool.length === 1) return pool[0];
  const w = pool.map(c => {
    const p = prog[c];
    if (!p || !p.s) return 7;
    if (p.b >= MASTER) return 1;
    return 7 - p.b + (due(c) ? 3 : 0);
  });
  for (let tries = 0; tries < 12; tries++) {
    let t = 0; for (const x of w) t += x;
    let r = Math.random() * t, i = 0;
    while (r > w[i] && i < pool.length - 1) { r -= w[i]; i++; }
    if (pool[i] !== V.last) return pool[i];
  }
  return pool[(Math.random() * pool.length) | 0];
}

function nextQuestion() {
  if (V.s === 'speed' && V.timeLeft <= 0) return;
  const c = pickCode();
  V.last = c;
  let k;
  if (V.s === 'speed') k = Math.random() < 0.55 ? 'name' : 'find';
  else { k = KINDS[V.kindI % KINDS.length]; V.kindI++; }
  if (k === 'shape' && V.codes.length < 4) k = 'name';
  ask({ k, c, pool: V.codes, scope: V.codes, help: false });
}

function quizDone() {
  clearInterval(V.clock); clearTimeout(V.t1); map.setFocus(null);
  const tot = V.right + V.wrong, pct = tot ? Math.round(V.right / tot * 100) : 0;
  const missed = Array.from(V.missed).filter(c => !master(c));
  const mid = V.mid, codes = V.codes, title = V.title, backLabel = V.backLabel;
  map.S.paint = {}; map.S.labels = []; map.S.only = null; map.S.showContext = true;
  codes.forEach(c => map.S.paint[c] = master(c) ? 'known' : (V.missed.has(c) ? 'miss' : 'on'));
  map.flyTo(codes);
  setProgress(pct / 100);
  V = { s: 'result', mid, codes, title, backLabel };
  nav(`<div class="pad"><h1 class="large">${pct >= 90 ? 'Sharp.' : pct >= 70 ? 'Getting there.' : 'Keep going.'}</h1>
    <p class="sub">${esc(title)}</p></div>
    <div class="stats">
      <div><i>${tot}</i><em>answered</em></div>
      <div><i>${pct}%</i><em>accuracy</em></div>
      <div><i>${codes.filter(master).length}/${codes.length}</i><em>mastered</em></div>
    </div>
    ${missed.length ? `<div class="ghead">Still shaky</div><div class="weak">${missed.map(c => `<span>${esc(nm(c))}</span>`).join('')}</div>` : ''}
    <div class="btns">
      <button class="bt p" data-go="again">Another round</button>
      ${mid ? `<button class="bt" data-go="module">Back to module</button>` : ''}
      <button class="bt" data-go="home">Modules</button>
    </div>`, { back: backLabel, title: 'Results' });
}

function speedDone() {
  clearInterval(V.clock); clearTimeout(V.t1); map.setFocus(null);
  const tot = V.right + V.wrong;
  const codes = V.codes, right = V.right;
  const best = Math.max(right, +(lsGet('atlas-speed') || 0));
  lsSet('atlas-speed', best);
  map.S.paint = {}; map.S.labels = []; map.S.only = null; map.S.showContext = true;
  map.flyTo(codes);
  V = { s: 'result', codes, title: 'Speed round', backLabel: 'Atlas' };
  nav(`<div class="pad"><h1 class="large">Time.</h1></div>
    <div class="big">${right}<span>correct in 60s</span></div>
    <div class="stats">
      <div><i>${tot}</i><em>answered</em></div>
      <div><i>${tot ? Math.round(right / tot * 100) : 0}%</i><em>accuracy</em></div>
      <div><i>${best}</i><em>personal best</em></div>
    </div>
    <div class="btns">
      <button class="bt p" data-go="speed">Run it again</button>
      <button class="bt" data-go="home">Modules</button>
    </div>`, { title: 'Speed round' });
}

/* ===================== module orientation ===================== */
function orientModule(id) {
  const m = MODS.find(x => x.id === id); if (!m) return home();
  V = { s: 'orient', id };
  if (map) map.setFocus(null);
  map.S.only = null; map.S.showContext = true; map.S.onPick = null;
  map.S.dim = new Set(m.codes); map.S.markers = new Set(m.codes);
  map.S.paint = {}; m.codes.forEach(c => map.S.paint[c] = 'on');
  map.S.labels = m.ch.map(ch => ({ code: ch.codes[0], text: ch.t, size: 12 }));
  map.flyTo(m.codes);
  nav(`<div class="tag">Where it sits</div>
    <div class="card">
      <div class="cname">${esc(m.name)} ${spk('m:' + m.id, m.name, m.name)}</div>
      <p class="say" style="margin-top:8px">${esc(m.say)}</p>
      <div class="hook">${esc(m.blurb)}</div>
      <div class="chips">${m.ch.map(ch => `<span class="chip">${esc(ch.t)}</span>`).join('')}</div>
    </div>
    <p class="foot">${m.codes.length} countries, grouped into ${m.ch.length} lessons. Spin or drag the map to look around.</p>
    <div class="btns"><button class="bt p" data-go="module">Start learning</button></div>`,
    { back: m.name, title: 'Module ' + m.num });
  say('m:' + m.id, m.name);
}

/* ===================== misc screens ===================== */
function resetScreen(armed) {
  V = { s: 'reset' };
  nav(`<div class="pad"><h1 class="large">Reset progress</h1>
    <p class="sub">This erases every box, streak and score on this device. Nothing is stored anywhere else, so it cannot be undone.</p></div>
    <div class="btns">
      <button class="bt" data-go="home">Keep my progress</button>
      <button class="bt" data-go="${armed ? 'reset-do' : 'reset-arm'}" style="color:var(--red)">${armed ? 'Tap again to erase everything' : 'Erase everything'}</button>
    </div>`, { back: 'Atlas', title: 'Reset' });
}

/* ===================== events ===================== */
document.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;

  if (b.dataset.clip != null) { say(b.dataset.clip, b.dataset.say); return; }

  if (b.dataset.pick != null) {
    if (V.lock || !ITEM) return;
    judge(b.dataset.pick === ITEM.c, ITEM.c, b.dataset.pick);
    return;
  }

  if (b.dataset.mod) return openModule(b.dataset.mod);

  if (b.dataset.lesson != null) {
    const k = +b.dataset.lesson;
    const mid = V.mid || V.id;
    return openLesson(mid, k);
  }

  if (b.dataset.proj) {
    map.setProj(b.dataset.proj);
    stageBg();
    lsSet('atlas-proj', b.dataset.proj);
    if (V.draw) V.draw();
    return;
  }

  const g = b.dataset.go;
  if (!g) return;

  switch (g) {
    case 'home': return home();
    case 'proj': return projScreen();
    case 'sound':
      sound = !sound;
      lsSet('atlas-sound', sound ? '1' : '0');
      if (!sound && synth) synth.cancel();
      return home();
    case 'reset': return resetScreen(false);
    case 'reset-arm': return resetScreen(true);
    case 'reset-do':
      prog = {}; save();
      lsDel('atlas-speed');
      return home();
    case 'next': return advance();
    case 'module': return openModule(V.mid || V.id || (MODS[0] && MODS[0].id));
    case 'orient': return orientModule(V.id);
    case 'next-lesson': {
      const m = MODS.find(x => x.id === V.id);
      let k = m.ch.findIndex(ch => !ch.codes.every(master));
      if (k < 0) k = 0;
      return openLesson(m.id, k);
    }
    case 'quiz-mod': {
      const m = MODS.find(x => x.id === V.id);
      return startQuiz(m.codes.filter(seen), m.name, { mid: m.id, backLabel: m.name });
    }
    case 'quiz-chunk': {
      const cs = V.ch.codes.slice(), m = V.m;
      return startQuiz(cs, V.ch.t, { mid: m.id, backLabel: m.name });
    }
    case 'again': return startQuiz(V.codes, V.title, { mid: V.mid, backLabel: V.backLabel });
    case 'finish': return quizDone();
    case 'review': {
      const d = dueList();
      return startQuiz(d.length ? d : seenList(), 'Review');
    }
    case 'speed': return startQuiz(seenList(), 'Speed round', { speed: true });
    case 'shape': {
      const sl = seenList();
      V = { s: 'quiz', codes: sl, title: 'Silhouettes', backLabel: 'Atlas',
            right: 0, wrong: 0, missed: new Set(), lock: false, last: null, kindI: 0 };
      const c = pickCode(); V.last = c;
      return ask({ k: 'shape', c, pool: sl, scope: sl });
    }
  }
});

$('#nav-back').addEventListener('click', () => {
  clearInterval(V.clock); clearTimeout(V.t1);
  switch (V.s) {
    case 'module': case 'proj': case 'reset': return home();
    case 'orient': return openModule(V.id);
    case 'lesson': return openModule(V.mid);
    case 'quiz': case 'speed': case 'result':
      return V.mid ? openModule(V.mid) : home();
    default: return home();
  }
});

matchMedia('(prefers-color-scheme:dark)').addEventListener('change', applyTheme);

/* commands the native shell can fire (Home Screen quick actions) */
window.atlasCommand = function (cmd) {
  if (!map) return;
  clearInterval(V.clock); clearTimeout(V.t1);
  if (cmd === 'review') { const d = dueList(); return startQuiz(d.length ? d : seenList(), 'Review'); }
  if (cmd === 'speed') return startQuiz(seenList(), 'Speed round', { speed: true });
  if (cmd === 'shape') {
    const sl = seenList(); if (sl.length < 4) return home();
    V = { s: 'quiz', codes: sl, title: 'Silhouettes', backLabel: 'Atlas',
          right: 0, wrong: 0, missed: new Set(), lock: false, last: null, kindI: 0 };
    const c = pickCode(); V.last = c; return ask({ k: 'shape', c, pool: sl, scope: sl });
  }
  if (cmd && cmd.indexOf('module:') === 0) return openModule(cmd.slice(7));
  return home();
};

/* ===================== boot ===================== */
function boot() {
  map = WorldMap($('#map'), DATA);
  map.S.theme = themeVars();
  const p = lsGet('atlas-proj');
  if (p && PROJECTIONS[p]) map.S.proj = p;
  map.size();
  stageBg();
  home();
  setTimeout(() => { map.size(); map.draw(); }, 60);
  try {
    const q = new URLSearchParams(location.search).get('go');
    if (q) setTimeout(() => window.atlasCommand(q), 0);
  } catch (e) {}
  native('ready', { mastered: ALL.filter(master).length, total: ALL.length, due: dueList().length });
  if (NATIVE) document.documentElement.classList.add('native');
}
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
else boot();

if('serviceWorker' in navigator)addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});
</script>
